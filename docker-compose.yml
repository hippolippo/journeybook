name: journeybook

services:
  pb:
    image: ${PB_IMAGE:-journeybook-pb:local}
    build:
      context: .
      dockerfile: docker/pocketbase.Dockerfile
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8090/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: ${WEB_IMAGE:-journeybook-web:local}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP_BASE: ${APP_BASE:-/journeybook}
    restart: unless-stopped
    depends_on:
      pb:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      APP_BASE: ${APP_BASE:-/journeybook}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pb_data:
  caddy_data:
  caddy_config:
